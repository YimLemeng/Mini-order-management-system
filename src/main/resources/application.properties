spring.application.name=OrderManagementSystem
spring.datasource.url=jdbc:postgresql://localhost:5432/order_systemdb
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:order_system}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

logging.level.org.springframework.web=info
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

