services:
  postgres-db:
    image: postgres:16-alpine
    container_name: order_management_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-order_system}
      POSTGRES_USER: ${DB_USER:-order_system}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: